<header class="navbar">
  <nav aria-label="Main navigation" class="navbar__inner">
    <a routerLink="/" class="navbar__brand" aria-label="Library home">
      <span class="navbar__logo">L</span>
      <span class="navbar__brand-text">
        <span class="navbar__title">Campus Library</span>
        <span class="navbar__subtitle">Library management</span>
      </span>
    </a>

    @if (isLoggedIn) {
      <div class="navbar__links">
        <span class="navbar__divider"></span>
        @if (userRole === 'STUDENT') {
          <a routerLink="/student/dashboard" routerLinkActive="navbar__link--active" ariaCurrentWhenActive="page" class="navbar__link">Student home</a>
          <a routerLink="/student/books" routerLinkActive="navbar__link--active" ariaCurrentWhenActive="page" class="navbar__link">Browse books</a>
          <a routerLink="/student/my-books" routerLinkActive="navbar__link--active" ariaCurrentWhenActive="page" class="navbar__link">My books</a>
          <!-- <a routerLink="/student/reservations" routerLinkActive="navbar__link--active" ariaCurrentWhenActive="page" class="navbar__link">Reservations</a> -->
        }

        @if (userRole === 'ADMIN') {
          <a routerLink="/admin/dashboard" routerLinkActive="navbar__link--active" ariaCurrentWhenActive="page" class="navbar__link">Admin home</a>
          <a routerLink="/admin/books" routerLinkActive="navbar__link--active" ariaCurrentWhenActive="page" class="navbar__link">Manage books</a>
          <a routerLink="/admin/issued-books" routerLinkActive="navbar__link--active" ariaCurrentWhenActive="page" class="navbar__link">Issued books</a>
        }
      </div>
    }

    <div aria-label="Account navigation" class="navbar__account">
      @if (!isLoggedIn) {
        <a routerLink="/login" routerLinkActive="navbar__link--active" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page" class="navbar__link">Login</a>
        <a routerLink="/register" routerLinkActive="navbar__link--active" ariaCurrentWhenActive="page" class="navbar__link">Register</a>
      } @else {
        <button type="button" (click)="logout()" class="navbar__logout">Logout</button>
      }
    </div>
  </nav>
</header>
